<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Portal Account - CABOS TECH</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .card { max-width: 420px; margin: 40px auto; background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 12px; }
        h2 { color: #60a5fa; margin-top: 0; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0 16px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #2563eb; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #1d4ed8; }
        .error { background: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 0.9em; text-align: center; }
        a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Join CABOS TECH Portal</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Full Name / Workshop Username</label>
            <input type="text" name="username" required placeholder="e.g. Solomon Technician">

            <label>Email Address</label>
            <input type="email" name="email" required placeholder="name@domain.com">

            <label>Portal Role</label>
            <select name="role">
                <option value="technician">🛠️ Workshop Technician</option>
                <option value="owner">🚗 Vehicle Owner</option>
                <option value="supplier">📦 Parts Seller / Supplier</option>
            </select>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Create Account</button>
        </form>
        <p style="text-align:center; font-size: 0.9em;">Already have an account? <a href="/login">Login here</a></p>
    </div>
</body>
</html>
